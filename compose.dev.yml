services:    
  database:
    image: postgres
    container_name: onebike_db
    environment:
      - POSTGRES_USER=onebike
      - POSTGRES_PASSWORD=onebike
      - POSTGRES_DB=onebike_db
    networks:
      - onebike_network
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onebike -d onebike_db"]
      interval: 5s
      timeout: 5s
      retries: 10
  server:
    build:
      context: ./server
      dockerfile: ./Dockerfile
      args:
        APP_VERSION: "0.0.1-SNAPSHOT"
    container_name: onebike_server
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/onebike_db
      - SPRING_DATASOURCE_USERNAME=onebike
      - SPRING_DATASOURCE_PASSWORD=onebike
      - SPRING_JPA_HIBERNATE_DDL_AUTO=create-drop
    depends_on:
      database:
        condition: service_healthy
    networks:
      - onebike_network
    ports:
      - "8080:8080"
networks:
  onebike_network:
    driver: bridge