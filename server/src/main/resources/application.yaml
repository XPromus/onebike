spring:
  application:
    name: onebike_backend
  datasource:
    url: jdbc:postgresql://localhost:5432/onebike_db
    driver-class-name: org.postgresql.Driver
    username: onebike
    password: onebike
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
